        class=\"mbox-text\"><div class=\"mbox-text-span\">This section <b>may be too
        technical for most readers to understand</b>.<span class=\"hide-when-compact\">
        Please <a class=\"external text\" href=\"https://en.wikipedia.org/w/index.php?title=Geosmin&amp;action=edit\">help
        improve it</a> to <a href=\"/wiki/Wikipedia:Make_technical_articles_understandable\"
        title=\"Wikipedia:Make technical articles understandable\">make it understandable
        to non-experts</a>, without removing the technical details.</span>  <span
        class=\"date-container\"><i>(<span class=\"date\">September 2024</span>)</i></span><span
        class=\"hide-when-compact\"><i> (<small><a href=\"/wiki/Help:Maintenance_template_removal\"
        title=\"Help:Maintenance template removal\">Learn how and when to remove this
        message</a></small>)</i></span></div></td></tr></tbody></table>\n<p><b>Geosmin</b>
        (<span class=\"rt-commentedText nowrap\"><span class=\"IPA nopopups noexcerpt\"
        lang=\"en-fonipa\"><a href=\"/wiki/Help:IPA/English\" title=\"Help:IPA/English\">/<span
        style=\"border-bottom:1px dotted\"><span title=\"/d\u0292/: &#39;j&#39; in
        &#39;jam&#39;\">d\u0292</span><span title=\"/i/: &#39;y&#39; in &#39;happy&#39;\">i</span><span
        title=\"/\u02C8/: primary stress follows\">\u02C8</span><span title=\"/\u0252/:
        &#39;o&#39; in &#39;body&#39;\">\u0252</span><span title=\"&#39;z&#39; in
        &#39;zoom&#39;\">z</span><span title=\"&#39;m&#39; in &#39;my&#39;\">m</span><span
        title=\"/\u026A/: &#39;i&#39; in &#39;kit&#39;\">\u026A</span><span title=\"&#39;n&#39;
        in &#39;nigh&#39;\">n</span></span>/</a></span></span> <a href=\"/wiki/Help:Pronunciation_respelling_key\"
        title=\"Help:Pronunciation respelling key\"><i title=\"English pronunciation
        respelling\">jee-<span style=\"font-size:90%\">OZ</span>-min</i></a>) is an
        irregular <a href=\"/wiki/Sesquiterpenoid\" class=\"mw-redirect\" title=\"Sesquiterpenoid\">sesquiterpenoid</a>
        with a distinct earthy or musty odor, which most people can easily smell.
        The geosmin <a href=\"/wiki/Odor_detection_threshold\" title=\"Odor detection
        threshold\">odor detection threshold</a> in humans is very low, ranging from
        0.006 to 0.01 micrograms per liter in water.<sup id=\"cite&#95;ref-aem2007&#95;1-0\"
        class=\"reference\"><a href=\"#cite_note-aem2007-1\"><span class=\"cite-bracket\">&#91;</span>1<span
        class=\"cite-bracket\">&#93;</span></a></sup> Geosmin, along with <a href=\"/wiki/2-methylisoborneol\"
        class=\"mw-redirect\" title=\"2-methylisoborneol\">2-methylisoborneol</a>,are
        the major biological causes of taste and odor outbreaks in drinking water
        worldwide and in <a href=\"/wiki/Fish_farming\" title=\"Fish farming\">farmed
        fish</a>.<sup id=\"cite&#95;ref-aem2007&#95;1-1\" class=\"reference\"><a href=\"#cite_note-aem2007-1\"><span
        class=\"cite-bracket\">&#91;</span>1<span class=\"cite-bracket\">&#93;</span></a></sup><sup
        id=\"cite&#95;ref-:1&#95;2-0\" class=\"reference\"><a href=\"#cite_note-:1-2\"><span
        class=\"cite-bracket\">&#91;</span>2<span class=\"cite-bracket\">&#93;</span></a></sup>
        Geosmin is also responsible for the earthy taste of <a href=\"/wiki/Beetroot\"
        title=\"Beetroot\">beetroots</a> and a contributor to the strong scent, known
        as <a href=\"/wiki/Petrichor\" title=\"Petrichor\">petrichor</a>, that occurs
        when rain falls after a spell of dry weather or when soil is disturbed.<sup
        id=\"cite&#95;ref-3\" class=\"reference\"><a href=\"#cite_note-3\"><span class=\"cite-bracket\">&#91;</span>3<span
        class=\"cite-bracket\">&#93;</span></a></sup> \n</p><p>Geosmin is a <a href=\"/wiki/Bicyclic_molecule\"
        title=\"Bicyclic molecule\">bicyclic</a> <a href=\"/wiki/Alcohol_(chemistry)\"
        title=\"Alcohol (chemistry)\">alcohol</a> with <a href=\"/wiki/Chemical_formula\"
        title=\"Chemical formula\">formula</a> <style data-mw-deduplicate=\"TemplateStyles:r1123817410\">.mw-parser-output
        .template-chem2-su{display:inline-block;font-size:80%;line-height:1;vertical-align:-0.35em}.mw-parser-output
        .template-chem2-su>span{display:block;text-align:left}.mw-parser-output sub.template-chem2-sub{font-size:80%;vertical-align:-0.35em}.mw-parser-output
        sup.template-chem2-sup{font-size:80%;vertical-align:0.65em}</style><span class=\"chemf
        nowrap\"><a href=\"/wiki/Carbon\" title=\"Carbon\">C</a><sub class=\"template-chem2-sub\">12</sub><a
        href=\"/wiki/Hydrogen\" title=\"Hydrogen\">H</a><sub class=\"template-chem2-sub\">22</sub><a
        href=\"/wiki/Oxygen\" title=\"Oxygen\">O</a></span>, a derivative of <a href=\"/wiki/Decalin\"
        title=\"Decalin\">decalin</a>. It is produced from the universal sesquiterpene
        precursor <a href=\"/wiki/Farnesyl_pyrophosphate\" title=\"Farnesyl pyrophosphate\">farnesyl
        pyrophosphate</a> (also known as farnesyl diphosphate), in a two-step <link
        rel=\"mw-deduplicated-inline-style\" href=\"mw-data:TemplateStyles:r1123817410\"
        /><span class=\"chemf nowrap\"><a href=\"/wiki/Magnesium\" title=\"Magnesium\">Mg<sup>2+</sup></a></span>-dependent
        reaction.<sup id=\"cite&#95;ref-4\" class=\"reference\"><a href=\"#cite_note-4\"><span
        class=\"cite-bracket\">&#91;</span>4<span class=\"cite-bracket\">&#93;</span></a></sup>
        Its name is derived from the <a href=\"/wiki/Ancient_Greek\" title=\"Ancient
        Greek\">Ancient Greek</a> words <span title=\"Ancient Greek transliteration\"
        lang=\"grc-Latn\"><i>ge\u014D-</i></span> (<span title=\"Ancient Greek (to
        1453)-language text\"><span lang=\"grc\"><a href=\"https://en.wiktionary.org/wiki/%CE%B3%E1%BF%86\"
        class=\"extiw\" title=\"wikt:\u03B3\u1FC6\">\u03B3\u03B5\u03C9-</a></span></span>),
        meaning \"earth\", and <span title=\"Ancient Greek transliteration\" lang=\"grc-Latn\"><i>osm\u1E17</i></span>
        (<span lang=\"grc\"><a href=\"https://en.wiktionary.org/wiki/%E1%BD%80%CF%83%CE%BC%CE%AE#Ancient_Greek\"
        class=\"extiw\" title=\"wikt:\u1F40\u03C3\u03BC\u03AE\">\u1F40\u03C3\u03BC\u03AE</a></span>),
        meaning \"smell\". The word was coined in 1965 by the American biochemist
        Nancy N. Gerber (1929\u20131985) and the French-American biologist Hubert
        A. Lechevalier (1926\u20132015).<sup id=\"cite&#95;ref-Gerber&#95;5-0\" class=\"reference\"><a
        href=\"#cite_note-Gerber-5\"><span class=\"cite-bracket\">&#91;</span>5<span
        class=\"cite-bracket\">&#93;</span></a></sup><sup id=\"cite&#95;ref-6\" class=\"reference\"><a
        href=\"#cite_note-6\"><span class=\"cite-bracket\">&#91;</span>6<span class=\"cite-bracket\">&#93;</span></a></sup>\n</p>\n<meta
        property=\"mw:PageProp/toc\" />\n<div class=\"mw-heading mw-heading2\"><h2
        id=\"Production\">Production</h2><span class=\"mw-editsection\"><span class=\"mw-editsection-bracket\">[</span><a
        href=\"/w/index.php?title=Geosmin&amp;action=edit&amp;section=1\" title=\"Edit
        section: Production\"><span>edit</span></a><span class=\"mw-editsection-bracket\">]</span></span></div>\n<p>Geosmin
        is produced as a <a href=\"/wiki/Secondary_metabolite\" title=\"Secondary
        metabolite\">secondary metabolite</a> by various blue-green algae (<a href=\"/wiki/Cyanobacteria\"
        title=\"Cyanobacteria\">cyanobacteria</a>), filamentous bacteria in the class
        <a href=\"/wiki/Actinomyces\" title=\"Actinomyces\">Actinomyces</a>, other
        prokaryotes, and various eukaryotes. The main genera in the cyanobacteria
        that have been shown to produce geosmin include <i><a href=\"/wiki/Anabaena\"
        title=\"Anabaena\">Anabaena</a></i>, <i><a href=\"/wiki/Phormidium\" title=\"Phormidium\">Phormidium</a></i>,
        and <i><a href=\"/wiki/Planktothrix\" title=\"Planktothrix\">Planktothrix</a></i>,
        while the main genus in the Actinomyces that produces geosmin is <i><a href=\"/wiki/Streptomyces\"
        title=\"Streptomyces\">Streptomyces</a></i>.<sup id=\"cite&#95;ref-aem2007&#95;1-2\"
        class=\"reference\"><a href=\"#cite_note-aem2007-1\"><span class=\"cite-bracket\">&#91;</span>1<span
        class=\"cite-bracket\">&#93;</span></a></sup><sup id=\"cite&#95;ref-7\" class=\"reference\"><a
        href=\"#cite_note-7\"><span class=\"cite-bracket\">&#91;</span>7<span class=\"cite-bracket\">&#93;</span></a></sup><sup
        id=\"cite&#95;ref-8\" class=\"reference\"><a href=\"#cite_note-8\"><span class=\"cite-bracket\">&#91;</span>8<span
        class=\"cite-bracket\">&#93;</span></a></sup><sup id=\"cite&#95;ref-9\" class=\"reference\"><a
        href=\"#cite_note-9\"><span class=\"cite-bracket\">&#91;</span>9<span class=\"cite-bracket\">&#93;</span></a></sup>
        In <a href=\"/wiki/Beetroot\" title=\"Beetroot\">beetroots</a>, geosmin is
        produced endogenously, not by environmental nor <a href=\"/wiki/Endophyte\"
        title=\"Endophyte\">endophytic</a> microbes, suggesting beets possess separate
        or acquired means of geosmin biosynthesis.<sup id=\"cite&#95;ref-10\" class=\"reference\"><a
        href=\"#cite_note-10\"><span class=\"cite-bracket\">&#91;</span>10<span class=\"cite-bracket\">&#93;</span></a></sup>
        Communities whose <a href=\"/wiki/Water\" title=\"Water\">water</a> supplies
        depend on surface water can periodically experience episodes of unpleasant-tasting
        water when a sharp drop in the population of these bacteria releases geosmin
        into the local water supply. Under <a href=\"/wiki/Acid\" title=\"Acid\">acidic</a>
        conditions, geosmin decomposes into odorless substances.<sup id=\"cite&#95;ref-Gerber&#95;5-1\"
        class=\"reference\"><a href=\"#cite_note-Gerber-5\"><span class=\"cite-bracket\">&#91;</span>5<span
        class=\"cite-bracket\">&#93;</span></a></sup>\n</p><p>In 2006, geosmin was
        <a href=\"/wiki/Biosynthesis\" title=\"Biosynthesis\">biosynthesized</a> by
        a bifunctional <i><a href=\"/wiki/Streptomyces_coelicolor\" class=\"mw-redirect\"
        title=\"Streptomyces coelicolor\">Streptomyces coelicolor</a></i> <a href=\"/wiki/Enzyme\"
        title=\"Enzyme\">enzyme</a>.<sup id=\"cite&#95;ref-11\" class=\"reference\"><a
        href=\"#cite_note-11\"><span class=\"cite-bracket\">&#91;</span>11<span class=\"cite-bracket\">&#93;</span></a></sup><sup
        id=\"cite&#95;ref-12\" class=\"reference\"><a href=\"#cite_note-12\"><span
        class=\"cite-bracket\">&#91;</span>12<span class=\"cite-bracket\">&#93;</span></a></sup>
        A single enzyme, <a href=\"/wiki/Geosmin_synthase\" title=\"Geosmin synthase\">geosmin
        synthase</a>, converts <a href=\"/wiki/Farnesyl_diphosphate\" class=\"mw-redirect\"
        title=\"Farnesyl diphosphate\">farnesyl diphosphate</a> to geosmin in a two-step
        reaction. The production and dispersal of the compound may give an evolutionary
        advantage to the producers. Geosmin and 2-methylisoborneol have been shown
        to attract <a href=\"/wiki/Springtail\" title=\"Springtail\">springtails</a>,
        <i><a href=\"/wiki/Folsomia_candida\" title=\"Folsomia candida\">Folsomia
        candida</a></i>, which are believed to feed on and spread the spores of <i>Streptomyces</i>
        both through their faces and by attachment to their cuticle.<sup id=\"cite&#95;ref-13\"
        class=\"reference\"><a href=\"#cite_note-13\"><span class=\"cite-bracket\">&#91;</span>13<span
        class=\"cite-bracket\">&#93;</span></a></sup>  \n</p><p>Not all blue-green
        algae produce geosmin. Identification of species that might produce geosmin
        is traditionally done through microscopic identification of geosmin-producing
        algae, a process that is labor-intensive and requires specialized knowledge.
        Recently a geosmin synthase gene <i>geoA</i>, was identified, which is present
        in cyanobacterial species that produce geosmin, but is not present in other
        cyanobacterial species.<sup id=\"cite&#95;ref-14\" class=\"reference\"><a
        href=\"#cite_note-14\"><span class=\"cite-bracket\">&#91;</span>14<span class=\"cite-bracket\">&#93;</span></a></sup>
        Amplification of this gene from water samples using <a href=\"/wiki/Real-time_PCR\"
        class=\"mw-redirect\" title=\"Real-time PCR\">real-time PCR</a> may permit
        predictions of taste and odor events caused by cyanobacteria in fresh water.\n</p>\n<div
        class=\"mw-heading mw-heading2\"><h2 id=\"Effects\">Effects</h2><span class=\"mw-editsection\"><span
        class=\"mw-editsection-bracket\">[</span><a href=\"/w/index.php?title=Geosmin&amp;action=edit&amp;section=2\"
        title=\"Edit section: Effects\"><span>edit</span></a><span class=\"mw-editsection-bracket\">]</span></span></div>\n<p>The
        human <a href=\"/wiki/Olfactory_system\" title=\"Olfactory system\">olfactory
        system</a> is extremely sensitive to geosmin and is able to detect it at concentrations
        as low as anywhere from 0.4 parts per billion<sup id=\"cite&#95;ref-15\" class=\"reference\"><a
        href=\"#cite_note-15\"><span class=\"cite-bracket\">&#91;</span>15<span class=\"cite-bracket\">&#93;</span></a></sup>
        to 5 parts per trillion.<sup id=\"cite&#95;ref-16\" class=\"reference\"><a
        href=\"#cite_note-16\"><span class=\"cite-bracket\">&#91;</span>16<span class=\"cite-bracket\">&#93;</span></a></sup>
        It is proposed that this extreme sensitivity to geosmin evolved in humans
        or their ancestors to aid them in their search for scarce water, but this
        is not conclusive.<sup id=\"cite&#95;ref-:0&#95;17-0\" class=\"reference\"><a
        href=\"#cite_note-:0-17\"><span class=\"cite-bracket\">&#91;</span>17<span
        class=\"cite-bracket\">&#93;</span></a></sup> Similarly, many insects possess
        a sensitivity to geosmin such that it may act as an attractant, signaling
        the presence of microbial prey, or as a repellant, where its presence may
        coincide with that of toxin-producing microbes.<sup id=\"cite&#95;ref-:0&#95;17-1\"
        class=\"reference\"><a href=\"#cite_note-:0-17\"><span class=\"cite-bracket\">&#91;</span>17<span
        class=\"cite-bracket\">&#93;</span></a></sup> Geosmin is also implicated in
        the migratory patterns of <a href=\"/wiki/Eel\" title=\"Eel\">eels</a>, where
        its higher concentration in freshwater systems guides the fish from the ocean
        into <a href=\"/wiki/Estuary\" title=\"Estuary\">estuaries</a> and <a href=\"/wiki/River\"
        title=\"River\">rivers</a>.<sup id=\"cite&#95;ref-18\" class=\"reference\"><a
        href=\"#cite_note-18\"><span class=\"cite-bracket\">&#91;</span>18<span class=\"cite-bracket\">&#93;</span></a></sup>
        Geosmin is also likely involved in raccoon predation of turtle nests, where
        burrowing disturbs the soil and ejects the chemical and other volatile indicators
        into the air.<sup id=\"cite&#95;ref-19\" class=\"reference\"><a href=\"#cite_note-19\"><span
        class=\"cite-bracket\">&#91;</span>19<span class=\"cite-bracket\">&#93;</span></a></sup>\n</p><p>Geosmin
        is responsible for the muddy smell in many commercially important freshwater
        fish such as <a href=\"/wiki/Carp\" title=\"Carp\">carp</a>, <a href=\"/wiki/Catfish\"
        title=\"Catfish\">catfish</a>, and <a href=\"/wiki/Tilapia\" title=\"Tilapia\">tilapia</a>.<sup
        id=\"cite&#95;ref-20\" class=\"reference\"><a href=\"#cite_note-20\"><span
        class=\"cite-bracket\">&#91;</span>20<span class=\"cite-bracket\">&#93;</span></a></sup><sup
        id=\"cite&#95;ref-:1&#95;2-1\" class=\"reference\"><a href=\"#cite_note-:1-2\"><span
        class=\"cite-bracket\">&#91;</span>2<span class=\"cite-bracket\">&#93;</span></a></sup><sup
        id=\"cite&#95;ref-Yamprayoon&#95;Noomhorm&#95;2000&#95;pp.&#95;29\u201341&#95;21-0\"
        class=\"reference\"><a href=\"#cite_note-Yamprayoon_Noomhorm_2000_pp._29\u201341-21\"><span
        class=\"cite-bracket\">&#91;</span>21<span class=\"cite-bracket\">&#93;</span></a></sup>
        Geosmin combines with <a href=\"/wiki/2-methylisoborneol\" class=\"mw-redirect\"
        title=\"2-methylisoborneol\">2-methylisoborneol</a>, which concentrates in
        the fatty skin and dark muscle tissues. It breaks down in acidic conditions;
        hence, vinegar and other acidic ingredients are used in fish recipes to reduce
        the muddy flavor.<sup id=\"cite&#95;ref-22\" class=\"reference\"><a href=\"#cite_note-22\"><span
        class=\"cite-bracket\">&#91;</span>22<span class=\"cite-bracket\">&#93;</span></a></sup>
        Taste and odor compounds including geosmin lead to an unpleasant taste of
        drinking water which is perceived by consumers as an indication of poor water
        quality.<sup id=\"cite&#95;ref-23\" class=\"reference\"><a href=\"#cite_note-23\"><span
        class=\"cite-bracket\">&#91;</span>23<span class=\"cite-bracket\">&#93;</span></a></sup>
        Despite its negative effects on the taste and odor of fish and drinking water,
        geosmin is nontoxic to humans.<sup id=\"cite&#95;ref-24\" class=\"reference\"><a
        href=\"#cite_note-24\"><span class=\"cite-bracket\">&#91;</span>24<span class=\"cite-bracket\">&#93;</span></a></sup>
        \n</p><p>This compound is reported to be an issue for saltwater fish farmed
        in <a href=\"/wiki/Recirculating_aquaculture_system\" title=\"Recirculating
        aquaculture system\">recirculating aquaculture systems</a>, such as <a href=\"/wiki/Atlantic_salmon\"
        title=\"Atlantic salmon\">Atlantic salmon</a>,<sup id=\"cite&#95;ref-25\"
        class=\"reference\"><a href=\"#cite_note-25\"><span class=\"cite-bracket\">&#91;</span>25<span
        class=\"cite-bracket\">&#93;</span></a></sup><sup class=\"noprint Inline-Template
        Template-Fact\" style=\"white-space:nowrap;\">&#91;<i><a href=\"/wiki/Wikipedia:Citation_needed\"
        title=\"Wikipedia:Citation needed\"><span title=\"This claim needs references
        to reliable sources. (August 2020)\">citation needed</span></a></i>&#93;</sup>
        but there are also studies that show that the presence in seawater is significantly
        lower than that found in freshwater which is why many people consider freshwater
        fish to taste muddy compared to marine fish.  These systems rely on biological
        filtration using cultured microbial communities to process the nitrogenous
        waste from the fish (<a href=\"/wiki/Ammonia\" title=\"Ammonia\">ammonia</a>)
        into less harmful compounds (<a href=\"/wiki/Nitrite\" title=\"Nitrite\">nitrite</a>
        and <a href=\"/wiki/Nitrate\" title=\"Nitrate\">nitrate</a>) that can be tolerated
        at higher concentrations. However, geosmin-producing bacteria can also grow
        in these systems, and often require fish to be transferred to an additional
        \"finishing\" or \"purge\" system where they are not fed for several days
        prior to harvest to remove off-flavor compounds and empty the intestinal tract.<sup
        class=\"noprint Inline-Template Template-Fact\" style=\"white-space:nowrap;\">&#91;<i><a
        href=\"/wiki/Wikipedia:Citation_needed\" title=\"Wikipedia:Citation needed\"><span
        title=\"This claim needs references to reliable sources. (August 2020)\">citation
        needed</span></a></i>&#93;</sup> This process is also known as <a href=\"/wiki/Depuration\"
        title=\"Depuration\">depuration</a>.\n</p>\n<div class=\"mw-heading mw-heading2\"><h2
        id=\"Geosmin_remediation_in_drinking_water\">Geosmin remediation in drinking
        water</h2><span class=\"mw-editsection\"><span class=\"mw-editsection-bracket\">[</span><a
        href=\"/w/index.php?title=Geosmin&amp;action=edit&amp;section=3\" title=\"Edit
        section: Geosmin remediation in drinking water\"><span>edit</span></a><span
        class=\"mw-editsection-bracket\">]</span></span></div>\n<p>Geosmin cannot
        be removed from water using standard treatment processes,<sup id=\"cite&#95;ref-26\"
        class=\"reference\"><a href=\"#cite_note-26\"><span class=\"cite-bracket\">&#91;</span>26<span
        class=\"cite-bracket\">&#93;</span></a></sup> requiring a combination of integrated
        solutions which may not be available to all municipal water suppliers. Possible
        advanced oxidation methods include <a href=\"/wiki/Photocatalysis#Filtration_membranes\"
        title=\"Photocatalysis\">photocatalysis</a>, <a href=\"/wiki/Ozone#Aquaculture\"
        title=\"Ozone\">ozonation</a>, and <a href=\"/wiki/Ultrasonic_cleaning\" title=\"Ultrasonic
        cleaning\">ultrasonication</a>.<sup id=\"cite&#95;ref-27\" class=\"reference\"><a
        href=\"#cite_note-27\"><span class=\"cite-bracket\">&#91;</span>27<span class=\"cite-bracket\">&#93;</span></a></sup>
        <a href=\"/wiki/Activated_carbon\" title=\"Activated carbon\">Activated carbon</a>
        filters may be able to help somewhat, but few studies have been completed
        to address this issue.<sup id=\"cite&#95;ref-28\" class=\"reference\"><a href=\"#cite_note-28\"><span
        class=\"cite-bracket\">&#91;</span>28<span class=\"cite-bracket\">&#93;</span></a></sup>\n</p>\n<div
        class=\"mw-heading mw-heading2\"><h2 id=\"See_also\">See also</h2><span class=\"mw-editsection\"><span
        class=\"mw-editsection-bracket\">[</span><a href=\"/w/index.php?title=Geosmin&amp;action=edit&amp;section=4\"
        title=\"Edit section: See also\"><span>edit</span></a><span class=\"mw-editsection-bracket\">]</span></span></div>\n<ul><li><a
        href=\"/wiki/Dimethyl_sulfide\" title=\"Dimethyl sulfide\">Dimethyl sulfide</a>
        \u2013 One of the molecules responsible for the odour of the sea</li>\n<li><a
        href=\"/wiki/Odor_detection_threshold\" title=\"Odor detection threshold\">Odor
        detection threshold</a>&#160;\u2013 Lowest perceivable odor concentration</li>\n<li><a
        href=\"/wiki/Petrichor\" title=\"Petrichor\">Petrichor</a>&#160;\u2013 Earthy
        smell when rain falls on dry soil</li></ul>\n<div class=\"mw-heading mw-heading2\"><h2
