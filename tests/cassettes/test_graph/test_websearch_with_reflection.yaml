        class=\"article_card_main_body\"><div class=\"article_card_main_body_title\">\U0001F327\uFE0FPT1
        How to smell like Rain/Petrichor \U0001F327\uFE0F</div><div class=\"article_card_main_body_content\">What
        you smell outside when it rains is a bacteria they use in typical antibiotics.
        \ I learned this fact for a professor in college years back so since then
