        Chemical Compounds Behind The Smell Of Rain\",\"link\":\"https://www.compoundchem.com/2014/05/14/thesmellofrain/\",\"snippet\":\"Their
        combination with geosmin in the air causes 'petrichor' \u2013 the name given
        by scientists in 1964 to the smell after rain.\",\"date\":\"May 14, 2014\",\"position\":1},{\"title\":\"Geosmin
        - Wikipedia\",\"link\":\"https://en.wikipedia.org/wiki/Geosmin\",\"snippet\":\"Geosmin
        is a bicyclic alcohol with formula C 12H 22O, a derivative of decalin. It
        is produced from the universal sesquiterpene precursor farnesyl pyrophosphate
        ...\",\"position\":2}],\"peopleAlsoAsk\":[{\"question\":\"What is the chemical
        composition of petrichor?\",\"snippet\":\"Petrichor is the smell of rain hitting
        the earth. When the first drops of water hit dry soil, a bacterium in the
        soil releases a combination of a fragrant chemicals called geosmin. Geosmin,
        which means \u201CEarth odor,\u201D is the main chemical compound that makes
        up petrichor.\",\"title\":\"The Sweet Smell of Rain: What is Petrichor? -
        Pit Liquor\",\"link\":\"https://pitliquor.com/blogs/news/how-we-replicate-the-smell-of-rain-in-limited-edition-spring\"},{\"question\":\"What
        chemical causes petrichor?\",\"snippet\":\"The smell is called petrichor,
        or sometimes geosmin, and is caused by the chemical Dimethyl-9-decalol. This
        substance is found in the spore coat of certain species of Actinomyces and
        Streptomyces of certain bacteria. The bacteria are ubiquitous in soils all
        round the world and in moist conditions they form filaments.\",\"title\":\"Why
        does the ground smell after it rains?\",\"link\":\"https://www.sciencefocus.com/planet-earth/why-does-the-ground-smell-after-it-rains\"},{\"question\":\"What
        is petrichor made of?\",\"snippet\":\"Petrichor is a combination of fragrant
        chemical compounds. Some are from oils made by plants. The main contributor
        to petrichor are actinobacteria. These tiny microorganisms can be found in
        rural and urban areas as well as in marine environments.\",\"title\":\"Why
        You Can Smell Rain - Texas A&M Stories\",\"link\":\"https://stories.tamu.edu/news/2018/09/03/why-you-can-smell-rain/\"},{\"question\":\"What
        are the components of petrichor?\",\"snippet\":\"SUMMARY: MAKEUP OF PETRICHOR\\nOzone.\\nGeosmin.\\nOther
        chemicals adsorbed to the earth as discovered in the original 1964 research
        paper (Elemental sulphur, organic compounds including pyridines, quinolines,
        carboxylic acids and others)\\nTerpenes and other volatile organic compounds
        already present in the atmosphere.\",\"title\":\"Making the smell of rain
        (Petrichor) - The Fragrance Foundry\",\"link\":\"https://thefragrancefoundry.com/blogs/perfume-making/making-the-smell-of-rain-petrichor\"}],\"relatedSearches\":[{\"query\":\"Petrichor
