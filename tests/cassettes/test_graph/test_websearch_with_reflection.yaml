    body: '{"messages":[{"role":"system","content":""},{"role":"system","content":"\nPlease
      generate a targeted web search query for a specific topic.\n\n<REQUIREMENTS>\n1.
      **Specificity:** The query must be specific and focused on a single aspect of
      the topic.\n2. **Relevance:** Ensure the query directly relates to the core
      topic.\n3. **Conciseness:** The query string must not exceed 100 characters.\n4.
      **Aspect Definition:** The ''aspect'' value must describe the specific focus
      of the query, excluding the main topic itself.\n5. **Rationale:** Briefly explain
      why this query is relevant for researching the topic.\n</REQUIREMENTS>\n\n<OUTPUT_FORMAT>\nRespond
      with a JSON object containing:\n- \"query\": The generated search query string.\n-
      \"aspect\": The specific aspect targeted by the query.\n- \"rationale\": A brief
      justification for the query''s relevance.\n</OUTPUT_FORMAT>\n\n<EXAMPLE_OUTPUT>\n```json\n{\n    \"query\":
      \"Rosalind Franklin DNA structure contributions\",\n    \"aspect\": \"DNA structure
      contributions\",\n    \"rationale\": \"Focuses on her specific scientific contributions
      rather than general biography, addressing a key area of her work.\"\n}\n```\n</EXAMPLE_OUTPUT>\n\nProvide
      your response in JSON format."},{"role":"system","content":"\nPlease generate
      a targeted web search query for a specific topic. The query will gather information
      related to a specific topic\nbased on specific knowledge gaps.\n\n<INPUT_FORMAT>\nYou
      will receive reflections in XML with `<reflections>` tags containing:\n- `<knowledge_gaps>`:
      information that has not been covered in the previous search results\n- `<covered_topics>`:
      information that has been covered and should not be repeated\n</INPUT_FORMAT>\n\n<REQUIREMENTS>\n1.
      The knowledge gaps form the basis of the search query.\n2. Identify the most
      relevant point in the knowledge gaps and use it to create a focused search query.\n3.
      Pick only one item from the list of knowledge gaps. Do not include all knowledge
      gaps in the construction of the query.\n4. Check that the query is not covering
      any aspects listed in the list of covered topics.\n5. Check that the query is
      at least vaguely related to the topic.\n6. Do not include the topic in the aspect
      of the query, since this is too broad.\n</REQUIREMENTS>\n\n<OUTPUT_FORMAT>\nRespond
      with a JSON object containing:\n- \"query\": The generated search query string.\n-
      \"aspect\": The specific aspect targeted by the query.\n- \"rationale\": A brief
      justification for the query''s relevance.\n</OUTPUT_FORMAT>\n\n<EXAMPLE_OUTPUT>\n```json\n{\n    \"query\":
      \"Rosalind Franklin DNA structure contributions\",\n    \"aspect\": \"DNA structure
      contributions\",\n    \"rationale\": \"Focuses on her specific scientific contributions
      rather than general biography, addressing a key area of her work.\"\n}\n```\n</EXAMPLE_OUTPUT>\n\nProvide
      your response in JSON format.Reflection on existing knowledge:\n<reflection>\n  <knowledge_gaps>\n    <item>chemical
      composition</item>\n    <item>psychological impact</item>\n    <item>regional
      variations</item>\n    <item>commercial applications</item>\n  </knowledge_gaps>\n  <covered_topics>\n    <item>definition
      and meaning</item>\n    <item>cultural significance</item>\n    <item>scientific
      mechanisms</item>\n  </covered_topics>\n</reflection>\nProvide your response
