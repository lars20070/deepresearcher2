        title=\"ctx&#95;ver=Z39.88-2004&amp;rft&#95;val&#95;fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Ajournal&amp;rft.genre=article&amp;rft.jtitle=Nature&amp;rft.atitle=Nature+of+argillaceous+odour&amp;rft.volume=201&amp;rft.issue=4923&amp;rft.pages=993-995&amp;rft.date=1964-03&amp;rft&#95;id=https%3A%2F%2Fapi.semanticscholar.org%2FCorpusID%3A4189441%23id-name%3DS2CID&amp;rft&#95;id=info%3Adoi%2F10.1038%2F201993a0&amp;rft&#95;id=info%3Abibcode%2F1964Natur.201..993B&amp;rft.aulast=Bear&amp;rft.aufirst=Isabel+Joy&amp;rft.au=Thomas%2C+Richard+G.&amp;rfr&#95;id=info%3Asid%2Fen.wikipedia.org%3APetrichor\"
