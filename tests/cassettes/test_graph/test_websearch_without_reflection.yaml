      string: "{\"searchParameters\":{\"q\":\"Petrichor chemical composition and origin
        -filetype:pdf\",\"type\":\"search\",\"num\":2,\"engine\":\"google\"},\"answerBox\":{\"snippet\":\"During
        rain, the oil is released into the air along with another compound, geosmin,
        a metabolic by-product of certain actinobacteria, such as Streptomyces, which
        is emitted by wet soil, producing the distinctive scent; ozone may also be
        present if there is lightning.\",\"snippetHighlighted\":[\"geosmin, a metabolic
        by-product of certain actinobacteria, such as Streptomyces\"],\"title\":\"Petrichor
        - Wikipedia\",\"link\":\"https://en.wikipedia.org/wiki/Petrichor\"},\"organic\":[{\"title\":\"The
        Chemical Compounds Behind The Smell Of Rain\",\"link\":\"https://www.compoundchem.com/2014/05/14/thesmellofrain/\",\"snippet\":\"The
        smell of rain is sometimes referred to as petrichor and has a number of contributors.
        Oils secreted by plants, compounds secreted by bacteria and the ...\",\"date\":\"May
        14, 2014\",\"position\":1},{\"title\":\"The Science Behind the Fresh Smell
        After Rain\",\"link\":\"https://www.oxidationtech.com/blog/the-science-behind-the-fresh-smell-after-rain/\",\"snippet\":\"The
        Origin of Petrichor ... In the 1960s, Australian chemists Isabel Bear and
        R.G. Thomas studied this phenomenon by extracting and analyzing oils from
        dry clay.\",\"position\":2}],\"peopleAlsoAsk\":[{\"question\":\"What is the
        chemical composition of petrichor?\",\"snippet\":\"Petrichor is the smell
        of rain hitting the earth. When the first drops of water hit dry soil, a bacterium
        in the soil releases a combination of a fragrant chemicals called geosmin.
        Geosmin, which means \u201CEarth odor,\u201D is the main chemical compound
        that makes up petrichor.\",\"title\":\"The Sweet Smell of Rain: What is Petrichor?
        - Pit Liquor\",\"link\":\"https://pitliquor.com/blogs/news/how-we-replicate-the-smell-of-rain-in-limited-edition-spring\"},{\"question\":\"What
        chemical causes petrichor?\",\"snippet\":\"The smell is called petrichor,
        or sometimes geosmin, and is caused by the chemical Dimethyl-9-decalol. This
        substance is found in the spore coat of certain species of Actinomyces and
        Streptomyces of certain bacteria. The bacteria are ubiquitous in soils all
        round the world and in moist conditions they form filaments.\",\"title\":\"Why
        does the ground smell after it rains?\",\"link\":\"https://www.sciencefocus.com/planet-earth/why-does-the-ground-smell-after-it-rains\"},{\"question\":\"Where
        does petrichor originate?\",\"snippet\":\"But moments before a rain event,
        an \u201Cearthy\u201D smell known as petrichor does permeate the air. People
        call it musky, fresh \u2013 generally pleasant. This smell actually comes
        from the moistening of the ground.\",\"title\":\"Why you can smell rain |
        Earth - EarthSky\",\"link\":\"https://earthsky.org/earth/what-is-smell-of-rain-petrichor/\"},{\"question\":\"What
        is the chemistry of petrichor?\",\"snippet\":\"Petrichor is caused primarily
        by a molecule called geosmin. Geosmin (meaning earth smell in Greek) is produced
        by Streptomyces, a Gram\u2013positive type of Actinobacteria. The chemical
        is released by the bacteria when they die. It is a bicyclic alcohol with the
        chemical formula C12H22O.\",\"title\":\"World Journal of Pharmaceutical Research
        - WJPR - Abstract\",\"link\":\"https://www.wjpr.net/abstract_show/5547\"}],\"relatedSearches\":[{\"query\":\"Petrichor
        chemical composition and origin wikipedia\"},{\"query\":\"Geosmin\"},{\"query\":\"Petrichor
        pronunciation\"},{\"query\":\"Petrichor chemical formula\"},{\"query\":\"Geosmin
        chemical formula\"},{\"query\":\"Petrichor origin\"},{\"query\":\"Petrichor
        perfume\"},{\"query\":\"Petrichor meaning\"}],\"credits\":1}"
