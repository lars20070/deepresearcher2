        regulated volatiles geosmin and 2-methylisoborneol attract a soil arthropod
        to Streptomyces bacteria promoting spore dispersal John Innes Centre. Meet
        the Molecules; Geosmin American Chemical Society. Geosmin\",\"keywords\":\"microbes
        & viruses, senses, weather\",\"image\":{\"@type\":\"ImageObject\",\"url\":\"https://cdn.discovermagazine.com/assets/image/57360/woman-with-umbrella-in-the-rain-x.jpg\",\"width\":\"1200\",\"height\":\"800\",\"caption\":\"The
        smell of rain is also known as petrichor.\"},\"thumbnailUrl\":\"https://cdn.discovermagazine.com/assets/image/57360/woman-with-umbrella-in-the-rain-t.jpg\",\"author\":{\"@type\":\"Person\",\"name\":\"Avery
        Hurt\",\"url\":\"https://www.discovermagazine.com/author/avery-hurt\",\"description\":\"Avery
        Hurt is a freelance science journalist who frequently writes for Discover
        Magazine, covering scientific studies on topics like neuroscience, insects,
        and microbes. Avery also writes regularly for a variety of outlets, both print
        and online, including National Geographic, New Scientist, Science News Explores,
